# web/ 폴더(설치 없는 웹 체험판)를 GitHub Pages 로 공개한다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꾼 뒤
#            Actions 탭 → "웹 체험판 배포 (GitHub Pages)" → Run workflow.
# 그다음부터는 main 의 web/ 이 바뀔 때마다 자동으로 다시 배포된다.
name: 웹 체험판 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
